<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
	<title>DASH DRM Angel One no_auth (Widevine)</title>
	<link rel="stylesheet" type="text/css" href="css/player.css">
	<meta name="robots" content="noindex">
</head>

<body>
	<script src="https://cdn.radiantmediatechs.com/rmp/10.1.2/js/rmp.min.js"></script>
	<div id="rmp"></div>
	<script>
		var src = {
			dash: 'https://storage.googleapis.com/shaka-demo-assets/angel-one-widevine/dash.mpd'
		};
		var settings = {
			licenseKey: 'your-license-key',
			src,
			autoplay: true,
			capLevelToPlayerSize: false,
			disableKeyboardControl: true,
			delayToFade: 5000,
			contentMetadata: {
				title: 'DASH DRM Angel One no_auth (Widevine)',
			},
			shakaDrm: {
				servers: {
					'com.widevine.alpha': 'https://cwip-shaka-proxy.appspot.com/no_auth'
				}
			},
			skin: 'tv'
		};
		const elementID = 'rmp';
		// Create an object based on RadiantMP constructor
		window.rmp = new RadiantMP(elementID);
		// Initialization ... and done!
		async function initRmpPlayer() {
			try {
				await window.rmp.init(settings);
			} catch (error) {
				// This should not happen often, but when it happens it could be due to:
				// invalid license key|cannot find container element (or PARENT)|no playback support
				console.error('Radiant Media Player failed to initialize', error);
			}
		}
		initRmpPlayer();
	</script>
	<script src="js/player.js"></script>
</body>

</html>
